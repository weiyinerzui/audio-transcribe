name: Debug Windows Build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build with full output
        shell: bash
        run: python packaging/build_windows.py --skip-pip 2>&1 | tee build.log
        continue-on-error: true
      - name: show tail
        shell: bash
        run: tail -40 build.log || true
      - name: skeleton only
        shell: bash
        run: |
          python - <<'PY'
          import ast,sys
          src=open('packaging/build_windows.py',encoding='utf-8').read()
          ast.parse(src)
          print("ast ok")
          PY
